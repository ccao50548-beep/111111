
      - name: Run unit tests
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR

          $env:PYTHONDONTWRITEBYTECODE = "1"

          if (Test-Path "测试") {
            python -m unittest discover -s "测试" -p "test_*.py" -v
          }
          elseif (Test-Path "tests") {
            python -m unittest discover -s "tests" -p "test_*.py" -v
          }
          else {
            throw "Test directory not found"
          }
