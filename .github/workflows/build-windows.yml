
name: Build JingcaiDesk V2.2 Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate V2.2 source
        shell: pwsh
        run: |
          $apps = @(
            Get-ChildItem -Path . -Recurse -File -Filter app.py |
            Where-Object {
              $_.FullName -notmatch '[\\/](测试|tests?|venv|\.venv)[\\/]'
            } |
            Where-Object {
              Test-Path (Join-Path $_.Directory.FullName "official.py")
            }
          )

          if ($apps.Count -ne 1) {
            throw "Expected one V2.2 app.py, found $($apps.Count)"
          }

          $dir = $apps[0].Directory.FullName

          "APP_DIR=$dir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0

      - name: Check Python syntax
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          python -m compileall -q .

      - name: Run unit tests
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR

          if (Test-Path "测试") {
            python -m unittest discover -s "测试" -p "test_*.py" -v
          }
          elseif (Test-Path "tests") {
            python -m unittest discover -s "tests" -p "test_*.py" -v
          }
          else {
            throw "Test directory not found"
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name JingcaiDesk `
            --hidden-import=tkinter `
            app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: JingcaiDesk-V2.2-Windows-EXE
          path: '**/dist/JingcaiDesk.exe'
          if-no-files-found: error
