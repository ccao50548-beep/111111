
name: Build JingcaiDesk Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $app = Get-ChildItem -Recurse -Filter app.py |
            Select-Object -First 1
          if (-not $app) {
            throw "app.py not found"
          }
          Set-Location $app.Directory.FullName
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name JingcaiDesk app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: JingcaiDesk-Windows-EXE
          path: '**/dist/JingcaiDesk.exe'
          if-no-files-found: error
